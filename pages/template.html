<div class="template-grid-container" id="template-page">
    <link rel="stylesheet" href="/css/template.css">

    <!-- Dashboard Stats Cards -->
    <div class="stats-dashboard">
        <!-- Static Total card removed, now rendered dynamically inside language grid -->

        <!-- Dynamic language cards will be inserted here -->
        <div id="language-stats-container" class="language-stats-grid"></div>
    </div>

    <!-- UNIFIED CONTROLS BAR -->
    <div class="unified-controls-bar" id="template-controls">
        <!-- Left: Add Button -->
        <div class="controls-left">
            <button id="btn-new-template" class="primary-btn">
                <span class="btn-icon">+</span>
                New Message
            </button>
        </div>

        <!-- Middle: Search and Filters -->
        <div class="controls-middle">
            <input type="text" id="search-templates" class="search-input" placeholder="🔍 Search templates..."
                title="Search templates">

            <select id="filter-language" class="filter-select" title="Language filter">
                <option value="">All Languages</option>
            </select>

            <select id="filter-category" class="filter-select" title="Category filter">
                <option value="">All Categories</option>
            </select>
        </div>

        <!-- Right: View Mode Toggle -->
        <div class="controls-right">
            <div class="view-mode-toggle">
                <button class="view-btn" data-view="list" title="List View">
                    <span class="view-icon">☰</span>
                </button>
                <button class="view-btn active" data-view="card" title="Card View">
                    <span class="view-icon">▦</span>
                </button>
                <button class="view-btn" data-view="detailed" title="Detailed View">
                    <span class="view-icon">▥</span>
                </button>
            </div>
        </div>
    </div>

    <!-- LIST VIEW CONTAINER -->
    <div id="template-list-container" class="template-list-container">
        <!-- Rendered by JS -->
    </div>

    <!-- EDITOR CONTAINER -->
    <div id="template-editor-container" class="hidden editor-container">

        <!-- 1. HEADER (Metadata) -->
        <div class="editor-header">
            <button id="btn-back-to-list" class="action-btn-secondary mr-4">
                ← Back
            </button>

            <div class="flex-1 flex-row gap-4 items-center">
                <input type="text" id="template-name-input" class="modern-input font-bold text-lg"
                    placeholder="Template Name" title="Template Name">

                <select id="template-language-select" class="modern-input w-48" title="Language selection">
                    <option value="">Select Language</option>
                </select>

                <select id="template-category-select" class="modern-input w-48" title="Category selection">
                    <option value="">Select Category</option>
                </select>
            </div>
        </div>

        <!-- 2. STUDIO GRID (3 Columns) - NO PREVIEW DASHBOARD -->
        <div class="editor-layout-grid">

            <!-- LEFT: MEDIA -->
            <div class="editor-col editor-panel">
                <div class="panel-title">Header Media</div>

                <!-- Media Preview (Visual) -->
                <div id="wa-media-preview" class="media-preview-box hidden">
                </div>
                <div id="wa-media-placeholder" class="media-preview-placeholder">
                    <span>No Media Selected</span>
                </div>

                <!-- Media Controls -->
                <div id="wa-media-controls" class="wa-media-controls">
                    <div class="flex-col gap-4">
                        <select id="media-type-select" class="modern-input" title="Media connection toggle">
                            <option value="none">No Media</option>
                            <option value="image">Image</option>
                            <option value="video">Video</option>
                            <option value="document">Document</option>
                        </select>

                        <div id="media-upload-area" class="flex-col gap-2">
                            <div class="flex-row gap-2 justify-center">
                                <button id="btn-open-media-library" class="cta-button media-btn-library">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                        viewBox="0 0 24 24" class="mr-1">
                                        <path
                                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                    Library
                                </button>
                                <button id="btn-upload-pc" class="cta-button media-btn-upload">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                        viewBox="0 0 24 24" class="mr-1">
                                        <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                    </svg>
                                    Upload
                                </button>
                            </div>
                            <input type="file" id="media-file-input" class="hidden"
                                accept="image/*,video/*,application/pdf" title="Media Upload File">

                            <div class="text-center text-sm text-muted">OR</div>

                            <input type="text" id="media-url-input" class="modern-input"
                                placeholder="Paste Image/Video URL" title="Paste Image URL">
                        </div>
                    </div>
                </div>
            </div>

            <!-- CENTER: CONTENT (Text Only) -->
            <div class="editor-col editor-col-center">

                <!-- Main Message Body -->
                <div class="content-card w-full bg-panel p-6 rounded-xl border-solid">
                    <div class="flex-row justify-between items-center mb-2">
                        <div class="text-xs text-muted font-bold uppercase">
                            Message Body
                        </div>
                        <button id="btn-translate-editor" class="text-xs pill-btn btn-translate">
                            🌍 Translate
                        </button>
                    </div>
                    <div class="wa-text-content cursor-text editable-preview min-h-200" id="wa-text-preview"
                        contenteditable="true"
                        data-placeholder="Type your message here... (Supports *bold*, _italic_, ~strike~)">
                    </div>
                </div>

                <!-- Footer -->
                <div class="content-card w-full bg-panel p-6 rounded-xl border-solid mt-4">
                    <div class="text-xs text-muted font-bold uppercase mb-2">
                        Footer (Optional)</div>
                    <div class="wa-footer cursor-text editable-preview" id="wa-footer-preview" contenteditable="true"
                        data-placeholder="Add a footer text..."></div>
                </div>
                <!-- Status Message -->
                <div id="status-message" class="text-sm font-bold hidden text-center mt-4 text-success">Message Sent!
                </div>
            </div>

            <!-- RIGHT: ACTIONS & BUTTONS -->
            <div class="editor-col editor-panel">

                <!-- ── MODE TOGGLE ──────────────────────────────── -->
                <div class="panel-section pb-0">
                    <div class="panel-title">Message Type</div>
                    <div id="editor-mode-toggle" class="flex-row gap-2 mt-2">
                        <button class="pill-btn flex-1 justify-center text-xs active" data-mode="buttons"
                            id="mode-btn-buttons">
                            🔘 Buttons
                        </button>
                        <button class="pill-btn flex-1 justify-center text-xs" data-mode="list" id="mode-btn-list">
                            📋 List Menu
                        </button>
                    </div>
                </div>

                <hr class="divider-hr m-0">

                <!-- ── BUTTONS PANEL (default) ──────────────────── -->
                <div id="panel-buttons-mode" class="panel-section">
                    <div class="panel-title">Interactive Buttons</div>

                    <!-- Buttons List (Visual) moved here -->
                    <div id="wa-buttons-preview" class="wa-buttons-container flex-col items-stretch gap-2 mb-4"></div>

                    <!-- Add Button -->
                    <div id="wa-button-add" class="wa-button-add">
                        <button class="pill-btn w-full justify-center">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24" class="mr-1">
                                <path d="M12 4v16m8-8H4"></path>
                            </svg>
                            Add Button
                        </button>
                    </div>

                    <!-- Button Edit Form -->
                    <div id="wa-button-edit-form" class="wa-button-edit-form hidden mt-4 border-solid p-4 rounded-lg">
                        <h4 class="text-sm mb-2 uppercase">Edit Button</h4>
                        <div class="flex-col gap-2">
                            <select id="btn-type-input" class="modern-input small" title="Button Match Type">
                                <option value="reply">Quick Reply</option>
                                <option value="url">URL Action</option>
                                <option value="call">Phone Number</option>
                                <option value="chat">Chat Button</option>
                                <option value="copy">Copy Code</option>
                            </select>

                            <label id="btn-dynamic-kam-wrapper" class="hidden btn-interactive-kam">
                                <input type="checkbox" id="btn-dynamic-kam"
                                    title="Use assigned KAM properties checkbox">
                                <span>Use assigned KAM phone number</span>
                            </label>
                            <input type="text" id="btn-text-input" class="modern-input small" placeholder="Button Label"
                                title="Action Button Text">
                            <input type="text" id="btn-value-input" class="modern-input small hidden"
                                placeholder="Value (URL/Phone)" title="Action Data Value">
                            <!-- Chat Button Specific Fields -->
                            <input type="text" id="btn-chat-phone-input" class="modern-input small hidden"
                                placeholder="Phone Number (e.g., 919876543210)" title="Chat Start Phone Number Target">
                            <textarea id="btn-chat-message-input"
                                class="modern-input small hidden resize-y font-inherit"
                                placeholder="Pre-filled message (optional)" rows="3"
                                title="Prefill Message on Chat Open Target"></textarea>
                            <button id="btn-confirm" class="pill-btn primary-btn w-full justify-center">Confirm</button>
                            <button id="btn-delete-button"
                                class="action-btn-secondary btn-delete-action-mt">Delete</button>
                        </div>
                    </div>
                </div>

                <!-- ── LIST MENU PANEL ──────────────────────────── -->
                <div id="panel-list-mode" class="panel-section hidden">
                    <div class="panel-title">List Menu</div>

                    <!-- Meta fields -->
                    <div class="flex-col gap-2 mb-4">
                        <input type="text" id="list-button-text" class="modern-input small"
                            placeholder="Button label (e.g. View Options)" maxlength="20"
                            title="Main Open List Button Label">
                        <input type="text" id="list-title" class="modern-input small"
                            placeholder="Menu title (optional)" maxlength="60"
                            title="Opened Bottomsheet Popup Header Label">
                    </div>

                    <!-- Sections container -->
                    <div id="list-sections-container" class="flex-col gap-3"></div>

                    <!-- Add Section button -->
                    <button id="btn-add-section" class="pill-btn w-full justify-center mt-3 text-xs">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" class="mr-1">
                            <path d="M12 4v16m8-8H4"></path>
                        </svg>
                        Add Section
                    </button>
                </div>

                <hr class="divider-hr m-0">



                <!-- Sample Message / Testing -->
                <div class="panel-section">
                    <div class="panel-title">Test & Save</div>

                    <div class="flex-col gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1">Sender KAM (For Dynamic Buttons)</label>
                            <!-- KAM Selector Container -->
                            <div id="test-kam-selector-container"></div>
                        </div>

                        <div>
                            <label class="block text-xs text-muted mb-1">Testing Session</label>
                            <select id="session-select" class="modern-input" title="Sender Source Phone">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1">Receiver Number</label>
                            <input type="text" id="phone-number" class="modern-input" placeholder="e.g. 919876543210"
                                title="Receiver number to drop testing sample">
                        </div>
                    </div>

                    <div class="flex-row gap-2 mt-6">
                        <button id="btn-send-message" class="cta-button btn-test-send">
                            Test Send
                        </button>
                        <button id="btn-save-template" class="cta-button">
                            Save Template
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
