<div class="fb-layout">
    <!-- Left Sidebar: Flow List -->
    <div class="fb-sidebar fb-sidebar-left">
        <div class="fb-sidebar-section fb-h-full">
            <div class="fb-sidebar-header">
                <h3>Your Flows</h3>
                <button class="btn btn-sm btn-primary" onclick="window.flowBuilderManager.createNewFlow()">+ New</button>
            </div>
            <div id="flow-list-container" class="fb-flow-list fb-flow-list-scroll">
                <div class="fb-loading-spinner">Loading flows...</div>
            </div>
        </div>
    </div>

    <!-- Center: React Canvas Area -->
    <div class="fb-main fb-main-relative">
        <!-- React App mounts here -->
        <div id="react-flow-builder-root" class="w-full h-full min-h-screen fb-hidden"></div>
        
        <!-- Empty state when no flow is selected -->
        <div id="no-flow-selected" class="fb-empty-state">
            <div class="fb-empty-icon">🔀</div>
            <h3>Visual Flow Builder</h3>
            <p>Select a flow from the sidebar to edit it, or create a new one to automate your WhatsApp conversations.</p>
            <button class="btn btn-primary btn-lg" onclick="window.flowBuilderManager.createNewFlow()">Create New Flow</button>
        </div>
    </div>
</div>
