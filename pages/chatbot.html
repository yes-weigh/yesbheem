<div class="page-container" id="chatbot-page">
    <div class="page-content chatbot-page-content">

        <div class="chatbot-layout">

            <!-- ─── Suggestions Sidebar ─────────────────────────── -->
            <aside class="chatbot-sidebar">
                <span class="chatbot-sidebar-title">Quick Actions</span>

                <button class="chatbot-suggestion-chip" data-prompt="Show me all dealers">
                    <span class="chip-icon">🤝</span>
                    Show all dealers
                </button>
                <button class="chatbot-suggestion-chip"
                    data-prompt="How many B2B leads do we have and what are their statuses?">
                    <span class="chip-icon">📋</span>
                    B2B lead overview
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="Search dealers in Kerala">
                    <span class="chip-icon">📍</span>
                    Dealers in Kerala
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="Show me all approved WhatsApp templates">
                    <span class="chip-icon">📄</span>
                    Approved templates
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="Show me the media library">
                    <span class="chip-icon">🖼️</span>
                    Browse media
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="Find dealers assigned to me">
                    <span class="chip-icon">👤</span>
                    My dealers
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="Show leads with status New">
                    <span class="chip-icon">🆕</span>
                    New leads
                </button>
                <button class="chatbot-suggestion-chip" data-prompt="What can you help me with?">
                    <span class="chip-icon">💡</span>
                    What can you do?
                </button>
            </aside>

            <!-- ─── Main Chat Panel ────────────────────────────── -->
            <div class="chatbot-panel">

                <!-- Header -->
                <div class="chatbot-header">
                    <div class="chatbot-avatar">🤖</div>
                    <div class="chatbot-header-info">
                        <h2>Yes Bheem AI</h2>
                        <p><span class="chatbot-status-dot"></span> Powered by Gemini 1.5 Flash</p>
                    </div>
                    <button class="chatbot-clear-btn" id="chatbot-clear-btn" title="Clear conversation">
                        Clear chat
                    </button>
                </div>

                <!-- Messages -->
                <div class="chatbot-messages" id="chatbot-messages">
                    <!-- Welcome state — hidden once first message is sent -->
                    <div class="chatbot-welcome" id="chatbot-welcome">
                        <span class="welcome-icon">🤖</span>
                        <h3>How can I help you today?</h3>
                        <p>Ask me anything about your dealers, leads, templates, or media. I can search, update, and
                            send WhatsApp messages on your behalf.</p>
                    </div>
                </div>

                <!-- Input Bar -->
                <div class="chatbot-input-bar">
                    <div class="chatbot-input-wrapper">
                        <textarea id="chatbot-input" placeholder="Ask anything… e.g. 'Show dealers in Stage 2'" rows="1"
                            aria-label="Chat message input"></textarea>
                    </div>
                    <button class="chatbot-send-btn" id="chatbot-send-btn" title="Send message"
                        aria-label="Send message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>

            </div><!-- /.chatbot-panel -->
        </div><!-- /.chatbot-layout -->

    </div>
</div>
